# Local Jenkins server: http://localhost:8081
services:
  jenkins:
    build: .
    container_name: jenkins
    user: root            # needed to access the Docker socket
    ports:
      - "8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins_home:
